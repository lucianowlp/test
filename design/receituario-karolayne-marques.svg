<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297" version="1.1">
  <title>Receituario Karolayne Marques</title>
  <desc>Modelo vetorial editavel em A4 para impressao de receituario odontologico.</desc>
  <defs>
    <radialGradient id="paperGlow" cx="50%" cy="47%" r="70%">
      <stop offset="0%" stop-color="#fffdfb"/>
      <stop offset="64%" stop-color="#fff8f4"/>
      <stop offset="100%" stop-color="#f7cbc3"/>
    </radialGradient>
    <linearGradient id="roseCorner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3b7b1" stop-opacity="0.95"/>
      <stop offset="47%" stop-color="#fff8f4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f2beb7" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8c5a17"/>
      <stop offset="45%" stop-color="#f2d18d"/>
      <stop offset="100%" stop-color="#9b6419"/>
    </linearGradient>
    <linearGradient id="monogramFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8d5cf"/>
      <stop offset="55%" stop-color="#f2b7ad"/>
      <stop offset="100%" stop-color="#fff4ed"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.8" stdDeviation="0.8" flood-color="#8c5a17" flood-opacity="0.2"/>
    </filter>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="0.45" flood-color="#f6d27d" flood-opacity="0.85"/>
    </filter>
    <style>
      :root {
        --gold: #9b6419;
        --gold-dark: #7b4d11;
        --gold-mid: #b87924;
        --rose: #f2b9b1;
        --ink: #8a5b1d;
      }

      .serif {
        font-family: "Cormorant Garamond", "Bodoni 72", "Times New Roman", serif;
      }

      .script {
        font-family: "Great Vibes", "Snell Roundhand", "Brush Script MT", cursive;
      }

      .small-caps {
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }

      .editable-text {
        fill: var(--ink);
        font-weight: 500;
      }

      .gold-stroke {
        stroke: url(#goldLine);
        stroke-linecap: round;
        fill: none;
      }

      .thin-gold {
        stroke: var(--gold-mid);
        stroke-width: 0.28;
        fill: none;
      }
    </style>
  </defs>

  <rect width="210" height="297" fill="url(#paperGlow)"/>
  <path d="M0 0 H210 V42 C162 20 54 18 0 43 Z" fill="url(#roseCorner)" opacity="0.38"/>
  <path d="M0 297 H210 V249 C160 279 51 278 0 248 Z" fill="url(#roseCorner)" opacity="0.45"/>

  <g id="decoracao-superior" filter="url(#goldGlow)">
    <path class="gold-stroke" stroke-width="0.62" d="M-9 29 C42 -9 128 -12 219 30"/>
    <path class="thin-gold" d="M-7 37 C45 2 132 -1 217 37"/>
    <path class="thin-gold" d="M-5 18 C53 -4 132 -8 214 22"/>
  </g>

  <g id="decoracao-inferior" filter="url(#goldGlow)">
    <path class="gold-stroke" stroke-width="0.7" d="M-6 255 C47 287 146 286 216 254"/>
    <path class="thin-gold" d="M-6 266 C55 294 144 291 216 269"/>
    <path class="thin-gold" d="M-7 275 C50 252 137 253 216 284"/>
  </g>

  <g id="cabecalho" text-anchor="middle">
    <circle cx="105" cy="31.5" r="16.3" fill="url(#monogramFill)" stroke="url(#goldLine)" stroke-width="0.55" filter="url(#softShadow)"/>
    <circle cx="105" cy="31.5" r="15" fill="none" stroke="#d69b4d" stroke-width="0.28" opacity="0.9"/>
    <text x="105" y="36.2" class="script editable-text" font-size="16" fill="#8a5614">KM</text>

    <text x="105" y="63.4" class="serif editable-text" font-size="10.4" letter-spacing="1.65" fill="#8b5c1c">
      Karolayne Marques
    </text>

    <line x1="52.5" y1="71.2" x2="64.2" y2="71.2" stroke="url(#goldLine)" stroke-width="0.34"/>
    <text x="105" y="72.8" class="serif editable-text small-caps" font-size="3.55" fill="#8b5c1c">
      Cirurgia Dentista - CRO RJ47453
    </text>
    <line x1="145.8" y1="71.2" x2="157.5" y2="71.2" stroke="url(#goldLine)" stroke-width="0.34"/>
  </g>

  <g id="campos" class="serif editable-text" font-size="4.1" fill="#8a5b1d">
    <text x="17.6" y="92.9">Paciente:</text>
    <line x1="35.4" y1="93.5" x2="134" y2="93.5" stroke="#b87a24" stroke-width="0.32"/>
    <text x="144" y="92.9">Data:</text>
    <line x1="155.4" y1="93.5" x2="162.6" y2="93.5" stroke="#b87a24" stroke-width="0.32"/>
    <text x="164.6" y="93" font-size="4.8">/</text>
    <line x1="169.2" y1="93.5" x2="176.4" y2="93.5" stroke="#b87a24" stroke-width="0.32"/>
    <text x="178.4" y="93" font-size="4.8">/</text>
    <line x1="183.1" y1="93.5" x2="191.8" y2="93.5" stroke="#b87a24" stroke-width="0.32"/>
  </g>

  <g id="assinatura" text-anchor="middle" class="serif editable-text" fill="#8a5b1d">
    <line x1="60" y1="232" x2="150" y2="232" stroke="url(#goldLine)" stroke-width="0.38"/>
    <text x="105" y="239.1" font-size="3.55">Assinatura e Carimbo</text>
  </g>

  <g id="rodape" class="serif editable-text" fill="#8a5b1d">
    <g id="icone-localizacao" transform="translate(43.2 276.4)">
      <path d="M0 -8.8 C-3.6 -8.8 -6.4 -6.1 -6.4 -2.6 C-6.4 2.4 0 8.8 0 8.8 C0 8.8 6.4 2.4 6.4 -2.6 C6.4 -6.1 3.6 -8.8 0 -8.8 Z" fill="none" stroke="#b87924" stroke-width="0.62"/>
      <circle cx="0" cy="-2.5" r="2.25" fill="#b87924"/>
    </g>

    <text x="56.4" y="274.7" font-size="4.1">
      <tspan x="56.4" dy="0">Maric&#225;: Rua Abreu Rangel 130,</tspan>
      <tspan x="56.4" dy="5.2">loja 103/104 - Centro</tspan>
      <tspan x="56.4" dy="5.2">(Galeria da Passagem)</tspan>
    </text>

    <line x1="105.5" y1="270.8" x2="105.5" y2="287.6" stroke="#b87924" stroke-width="0.28"/>

    <g id="icone-telefone" transform="translate(116 273.5)">
      <circle cx="0" cy="0" r="4.1" fill="none" stroke="#b87924" stroke-width="0.62"/>
      <path d="M-1.7 -2.1 C-1.2 -0.1 0.1 1.2 2.1 1.7 L2.9 0.7 C3.1 0.4 3 0.1 2.7 -0.1 L1.5 -0.8 C1.2 -1 0.9 -0.9 0.7 -0.6 L0.2 0.1 C-0.4 -0.2 -0.9 -0.7 -1.2 -1.3 L-0.5 -1.8 C-0.2 -2 -0.1 -2.3 -0.3 -2.6 L-1 -3.8 C-1.2 -4.1 -1.6 -4.2 -1.9 -4 L-2.8 -3.2 C-2.5 -2.8 -2.1 -2.4 -1.7 -2.1 Z" fill="#b87924" transform="scale(0.78)"/>
    </g>
    <text x="123.5" y="274.9" font-size="4.2">(21) 99578-1885</text>

    <g id="icone-instagram" transform="translate(116 285.1)">
      <rect x="-4.1" y="-4.1" width="8.2" height="8.2" rx="2" fill="none" stroke="#b87924" stroke-width="0.62"/>
      <circle cx="0" cy="0" r="2" fill="none" stroke="#b87924" stroke-width="0.58"/>
      <circle cx="2.55" cy="-2.5" r="0.55" fill="#b87924"/>
    </g>
    <text x="123.5" y="286.5" font-size="4.2">karolayne_cm</text>
  </g>
</svg>
